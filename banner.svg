<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#0f1016"/>
      <stop offset="100%" stop-color="#131520"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e202e" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect width="920" height="250" rx="14" fill="url(#bg)" stroke="#262736" stroke-width="1.5"/>
  <rect width="920" height="250" rx="14" fill="url(#grid)" opacity="0.6"/>
  <rect width="920" height="250" rx="14" fill="url(#glow)"/>

  <!-- Right Neovim / Hyprland floating terminal window -->
  <g transform="translate(565, 28)">
    <rect x="0" y="0" width="320" height="194" rx="10" fill="#0b0c10" stroke="#2a2c3d" stroke-width="1.2"/>
    <circle cx="18" cy="15" r="4" fill="#f43f5e" opacity="0.8"/>
    <circle cx="32" cy="15" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="46" cy="15" r="4" fill="#10b981" opacity="0.8"/>
    <text x="160" y="18" text-anchor="middle" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">yukon@arch ~ nvim</text>
    <line x1="0" y1="28" x2="320" y2="28" stroke="#1e202e" stroke-width="1"/>

    <text x="18" y="52" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">$ fastfetch --minimal</text>
    <text x="18" y="74" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">os     </text>
    <text x="78" y="74" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Arch Linux (Omarchy / Hyprland)</text>

    <text x="18" y="94" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">editor </text>
    <text x="78" y="94" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Neovim</text>

    <text x="18" y="114" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">focus  </text>
    <text x="78" y="114" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Data Eng · Backend · NLP</text>

    <text x="18" y="134" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">stack  </text>
    <text x="78" y="134" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">py · sql · fastapi · go</text>

    <text x="18" y="164" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">$ _</text>
    <rect x="38" y="153" width="7" height="14" fill="#34d399">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Left Hero Content -->
  <g transform="translate(44, 52)">
    <g transform="translate(0, 0)">
      <circle cx="6" cy="-4" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="0" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" letter-spacing="1.8">SSMYS3 // YUKON</text>
    </g>

    <text x="0" y="44" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="31" font-weight="700" letter-spacing="-0.6">
      Data &amp; Backend,
    </text>
    <text x="0" y="80" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="25" font-weight="500" letter-spacing="-0.4">
      small games &amp; late-night Linux configs.
    </text>

    <rect x="0" y="102" width="420" height="2" rx="1" fill="url(#accent)"/>

    <text x="0" y="130" fill="#94949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      CS '28 · Python · SQL · FastAPI · Go
    </text>
  </g>
</svg>
